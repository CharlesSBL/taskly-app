version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /ai_test_agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "storybook"
          - "@storybook/*"
          - "@testing-library/*"
    ignore:
      # These are coupled: a lone major bump fails npm's peer resolution.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/react-vite"
        update-types: ["version-update:semver-major"]
